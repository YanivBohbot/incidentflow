include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

# Queue URLs are http://<host>:9324/000000000000/<name>.
queues {
  incidentflow-investigations {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue {
      name = "incidentflow-investigations-dlq"
      maxReceiveCount = 3
    }
  }
  incidentflow-investigations-dlq {}
}
