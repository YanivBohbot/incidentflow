
services:
  postgres:
    image: postgres:16
    container_name: incidentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: incidentflow_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidentflow -d incidentflow_db
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://incidentflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/incidentflow_db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://incidentflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/incidentflow_db
      # Reuse the encrypted OAuth cache created by the local Jira MCP authorization flow.
      MCP_OAUTH_TOKEN_STORE_DIR: /app/.local/oauth-tokens
      # The image ships the CloudWatch MCP server in its own venv; override host uv settings.
      CLOUDWATCH_MCP_COMMAND: /opt/cloudwatch-mcp/bin/awslabs.cloudwatch-mcp-server
      CLOUDWATCH_MCP_COMMAND_ARGS: ""
      # The MongoDB MCP server runs on the host; 127.0.0.1 inside the container is the container.
      MONGODB_MCP_URL: ${MONGODB_MCP_DOCKER_URL:-http://host.docker.internal:3000/mcp}
      # The container has no Docker CLI, so GitHub MCP uses GitHub's remote server over HTTP
      # with GITHUB_PERSONAL_ACCESS_TOKEN (read-only header set by the client).
      GITHUB_MCP_TRANSPORT: http
      GITHUB_MCP_URL: ${GITHUB_MCP_DOCKER_URL:-https://api.githubcopilot.com/mcp/}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api/.local/oauth-tokens:/app/.local/oauth-tokens
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: incidentflow-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Copy .env.example to .env and set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: incidentflow_db
      KC_DB_USERNAME: incidentflow
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
