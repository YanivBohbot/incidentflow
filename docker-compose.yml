
services:
  postgres:
    image: postgres:16
    container_name: incidentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentflow
      POSTGRES_PASSWORD: incidentflow_dev
      POSTGRES_DB: incidentflow_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidentflow -d incidentflow_db
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
