
services:
  postgres:
    image: postgres:16
    container_name: incidentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentflow
      POSTGRES_PASSWORD: incidentflow_dev
      POSTGRES_DB: incidentflow_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidentflow -d incidentflow_db
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: incidentflow-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: incidentflow_db
      KC_DB_USERNAME: incidentflow
      KC_DB_PASSWORD: incidentflow_dev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
