
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentflow-api"
version = "0.1.0"
description = "Enterprise AI Incident Management Platform"
requires-python = ">=3.12,<3.14"

dependencies = [
    # FastAPI
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",

    # PostgreSQL
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",

    # Database migrations
    "alembic>=1.14,<2.0",

    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",

]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
