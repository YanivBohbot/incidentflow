
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentflow-api"
version = "0.1.0"
description = "Enterprise AI Incident Management Platform"
requires-python = ">=3.12,<3.14"

dependencies = [
    # FastAPI
    "fastapi",
    "beautifulsoup4",
    "uvicorn[standard]",
    "pydantic-settings",

    # PostgreSQL
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",

    # Database migrations
    "alembic>=1.14,<2.0",

    "langchain[mcp]>=1.4,<2.0",
    "langchain-community",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres",
    # Imported directly: the checkpointer runs over a checked pool, not one long-lived connection.
    "psycopg-pool>=3.2,<4.0",
    "langchain-openai>=1.0,<2.0",
    "diskcache",
    "py-key-value-aio[disk,dynamodb]",
    # The DynamoDB token store's aioboto3 pins aiobotocore, which pins botocore tightly; stating
    # both ranges keeps pip from backtracking through every newer boto3 release.
    "aioboto3>=15.5,<16",
    "langchain-pinecone",
    "langchain-text-splitters",
    "langsmith>=0.4,<1.0",
    "pypdf",
    "boto3>=1.40.46,<1.40.62",
    # Verifies Cognito access tokens (RS256 via the user pool JWKS).
    "PyJWT[crypto]>=2.8,<3",

]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
